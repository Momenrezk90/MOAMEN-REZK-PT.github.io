<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moamen Rezk | Portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --electric-blue: #00f3ff;
            --cyber-purple: #b400ff;
            --neon-green: #39ff14;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }
        .cyber-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 243, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(180, 0, 255, 0.1) 0%, transparent 50%);
            animation: bgShift 20s ease infinite;
        }
        @keyframes bgShift {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
        @keyframes glitchText {
            0%, 90%, 100% { text-shadow: none; }
            92% { text-shadow: 2px 0 var(--electric-blue), -2px 0 var(--cyber-purple); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes cardShine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
        
        #landingPage { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 2rem; 
        }
        .landing-content { text-align: center; max-width: 1000px; }
        .landing-title {
            font-size: 4.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            animation: glitchText 2s infinite;
            background: linear-gradient(90deg, var(--electric-blue), var(--cyber-purple), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .landing-subtitle { 
            font-size: 1.5rem; 
            color: var(--text-secondary); 
            margin-bottom: 3rem; 
        }
        .choice-cards { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 2rem; 
            margin-top: 3rem; 
        }
        .choice-card {
            background: var(--card-bg);
            padding: 3rem 2rem;
            border-radius: 15px;
            border: 2px solid rgba(0, 243, 255, 0.3);
            cursor: pointer;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: block;
            color: inherit;
        }
        .choice-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(0, 243, 255, 0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.5s;
        }
        .choice-card:hover::before { animation: cardShine 1.5s ease infinite; }
        .choice-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--electric-blue);
            box-shadow: 0 20px 50px rgba(0, 243, 255, 0.4);
        }
        .choice-card.marketing:hover {
            border-color: var(--cyber-purple);
            box-shadow: 0 20px 50px rgba(180, 0, 255, 0.4);
        }
        .choice-icon { font-size: 4rem; margin-bottom: 1.5rem; }
        .choice-title { 
            font-size: 2rem; 
            color: var(--electric-blue); 
            margin-bottom: 1rem; 
        }
        .choice-card.marketing .choice-title { color: var(--cyber-purple); }
        .choice-description { 
            color: var(--text-secondary); 
            font-size: 1.1rem; 
            line-height: 1.8; 
        }
        
        @media (max-width: 768px) {
            .landing-title { font-size: 2.5rem; }
            .choice-cards { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 480px) {
            .landing-title { font-size: 2rem; }
            .landing-subtitle { font-size: 1.2rem; }
            .choice-description { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="cyber-bg"></div>

    <div id="landingPage">
        <div class="landing-content">
            <h1 class="landing-title">MOAMEN REZK</h1>
            <p class="landing-subtitle">Choose Your Path</p>
            
            <div class="choice-cards">
                <a href="https://momenrezk90.github.io/MOAMEN-REZK-PT.github.io/Cy-PT.html" class="choice-card" target="_blank" rel="noopener noreferrer">
                    <div class="choice-icon">🔐</div>
                    <h2 class="choice-title">Cybersecurity</h2>
                    <p class="choice-description">
                        Penetration Tester & Security Researcher<br>
                        Specialized in web/mobile security, OSINT, and bug bounty hunting
                    </p>
                </a>

                <a href="https://momenrezk90.github.io/MOAMEN-REZK-PT.github.io/Mark-PT.html" class="choice-card marketing" target="_blank" rel="noopener noreferrer">
                    <div class="choice-icon">🎨</div>
                    <h2 class="choice-title">Tech Marketing</h2>
                    <p class="choice-description">
                        Tech Marketing Specialist & AI-Driven Content Creator<br>
                        Ranked #36 on Favikon's Top 200 Creators in Egypt
                    </p>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
